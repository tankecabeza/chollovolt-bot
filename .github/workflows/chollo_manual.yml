name: 🎯 Publicar Chollo Manual

on:
  workflow_dispatch:
    inputs:
      url_amazon:
        description: 'Pega aquí TU ENLACE ACORTADO de afiliado (ej: amzn.to/...)'
        required: true
        type: string

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          
      - name: Publicar chollo con enlace propio
        env:
          X_STATE: ${{ secrets.X_STATE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python chollo_manual.py "${{ github.event.inputs.url_amazon }}"
        
      - name: Subir captura si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-captura-manual
          path: error_manual.png
          if-no-files-found: ignore
