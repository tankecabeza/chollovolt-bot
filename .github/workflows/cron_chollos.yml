name: Bot Automatico CholloVolt

on:
  schedule:
    # Horas UTC. En España peninsular: UTC+1 en invierno y UTC+2 en verano.
    - cron: '15 8 * * *'
    - cron: '42 9 * * *'
    - cron: '05 11 * * *'
    - cron: '30 12 * * *'
    - cron: '18 14 * * *'
    - cron: '55 15 * * *'
    - cron: '22 17 * * *'
    - cron: '45 18 * * *'
    - cron: '10 20 * * *'
    - cron: '37 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-chollo
  cancel-in-progress: false

jobs:
  publicar-chollo:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 3. Restaurar caché de Chromium de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('requirements.txt') }}-v1

      - name: 4. Instalar dependencias y Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 5. Espera aleatoria (solo ejecuciones programadas)
        if: github.event_name == 'schedule'
        run: |
          TIEMPO=$((RANDOM % 300))
          echo "Esperando aleatoriamente $TIEMPO segundos (máximo 5 minutos)."
          sleep "$TIEMPO"

      - name: 6. Ejecutar el bot
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          X_STATE: ${{ secrets.X_STATE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python auto_chollovolt.py

      - name: 7. Subir captura si hay error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-captura
          path: error.png
          if-no-files-found: ignore
          retention-days: 7

      # El estado por plataforma es el historial principal. Se conserva también
      # historial_publicados.txt por compatibilidad con las ejecuciones antiguas.
      - name: 8. Guardar historial y subir cambios
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "CholloVolt-Bot"
          git config user.email "bot@users.noreply.github.com"
          touch historial_estados.json
          git add historial_estados.json
          if [ -f historial_publicados.txt ]; then
            git add historial_publicados.txt
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar historial de publicaciones"
          fi
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
