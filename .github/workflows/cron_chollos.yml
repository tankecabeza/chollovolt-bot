name: Bot Automatico CholloVolt

on:
  schedule:
    # Horario salpicado (horas UTC)
    - cron: '15 8 * * *'
    - cron: '42 9 * * *'
    - cron: '05 11 * * *'
    - cron: '30 12 * * *'
    - cron: '18 14 * * *'
    - cron: '55 15 * * *'
    - cron: '22 17 * * *'
    - cron: '45 18 * * *'
    - cron: '10 20 * * *'
    - cron: '37 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-chollo
  cancel-in-progress: false

jobs:
  publicar-chollo:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Python 3.11 (con caché de pip)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 3. Restaurar caché de Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('requirements.txt') }}-v1

      - name: 4. Instalar librerías y navegador Playwright
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # Antes esperaba hasta 25 min por ejecución (media ~12 min). Ahora máximo 3 min.
      # Los cron ya están repartidos a horas "irregulares"; si no quieres espera, borra este paso.
      - name: 5. Espera aleatoria corta (solo ejecuciones programadas)
        if: github.event_name == 'schedule'
        run: |
          TIEMPO=$((RANDOM % 180))
          echo "⏳ Esperando $TIEMPO segundos..."
          sleep "$TIEMPO"

      - name: 6. Ejecutar el bot y publicar en X y Telegram
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          X_STATE: ${{ secrets.X_STATE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Criterios de búsqueda (el script ya lee estas variables)
          MIN_DESCUENTO: '25'          # % mínimo para publicar
          UMBRAL_ERROR_PRECIO: '50'    # desde este % se marca "posible error de precio"
          MAX_DESCUENTO: '95'          # por encima se descarta (probable fallo de lectura)
          MAX_REVISAR: '40'            # productos a verificar por ejecución
          CONCURRENCIA: '4'            # páginas de Amazon abiertas a la vez
        run: python auto_chollovolt.py

      - name: 7. Subir captura si existe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-captura
          path: error.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 8. Guardar el ASIN publicado en el historial
        if: always()
        run: |
          git config user.name "CholloVolt-Bot"
          git config user.email "bot@users.noreply.github.com"
          [ -f historial_publicados.txt ] && git add historial_publicados.txt
          if git diff --cached --quiet; then
            echo "Sin cambios en el historial."
            exit 0
          fi
          git commit -m "Añadido nuevo chollo publicado al historial"
          for intento in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" \
              && git push origin "HEAD:${GITHUB_REF_NAME:-main}" && exit 0
            echo "Intento $intento fallido; reintentando..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::No se pudo subir el historial."
          exit 1
