name: Bot Automatico CholloVolt

on:
  schedule:
    # Horario "humano" salpicado (horas UTC; en España invierno suma 1 hora)
    - cron: '15 8 * * *'
    - cron: '42 9 * * *'
    - cron: '05 11 * * *'
    - cron: '30 12 * * *'
    - cron: '18 14 * * *'
    - cron: '55 15 * * *'
    - cron: '22 17 * * *'
    - cron: '45 18 * * *'
    - cron: '10 20 * * *'
    - cron: '37 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Evita que dos ejecuciones (manual y programada) se pisen
concurrency:
  group: publicar-chollo
  cancel-in-progress: false

jobs:
  publicar-chollo:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # corta ejecuciones atascadas

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 2b. Caché del navegador Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: 3. Instalar librerías y navegador Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 3b. Espera aleatoria (solo en modo automático)
        if: github.event_name == 'schedule'
        run: |
          TIEMPO=$((RANDOM % 1500))
          echo "⏳ Esperando $TIEMPO segundos..."
          sleep $TIEMPO

      - name: 4. Ejecutar el bot y publicar en X y Telegram
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          X_STATE: ${{ secrets.X_STATE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python auto_chollovolt.py

      - name: 4b. Subir captura si ha fallado
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-captura
          path: error.png
          if-no-files-found: ignore

      # always(): guarda el historial aunque X falle, para no repetir
      # un producto que ya salió en Telegram
      - name: 5. Guardar el ASIN publicado en el historial
        if: always()
        run: |
          git config --global user.name "CholloVolt-Bot"
          git config --global user.email "bot@chollovolt.local"
          git add historial_publicados.txt
          git diff --staged --quiet || git commit -m "Añadido nuevo chollo publicado al historial"
          git pull --rebase origin main
          git push
