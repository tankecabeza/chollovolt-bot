name: Bot Automatico CholloVolt

on:
  schedule:
    # 8 ejecuciones al día (cada 2 horas, entre las 07:15 y las 21:15 UTC)
    - cron: '15 7-21/2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-chollo
  cancel-in-progress: false

jobs:
  publicar-chollo:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 3. Restaurar caché de Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('requirements.txt') }}-v1

      - name: 4. Instalar librerías y navegador Playwright
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 5. Espera aleatoria corta
        if: github.event_name == 'schedule'
        run: |
          TIEMPO=$((RANDOM % 120))
          echo "⏳ Esperando $TIEMPO segundos..."
          sleep "$TIEMPO"

      - name: 6. Ejecutar el bot
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          X_STATE: ${{ secrets.X_STATE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_DESCUENTO: '25'
          UMBRAL_ERROR_PRECIO: '50'
          MAX_DESCUENTO: '95'
          MAX_REVISAR: '12'
          CONCURRENCIA: '1'
          BLOQUEAR_RECURSOS: '0'
        run: python auto_chollovolt.py

      - name: 7. Subir captura si existe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-captura
          path: error.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 8. Guardar historial
        if: always()
        run: |
          git config user.name "CholloVolt-Bot"
          git config user.email "bot@users.noreply.github.com"
          [ -f historial_publicados.txt ] && git add historial_publicados.txt
          if git diff --cached --quiet; then
            echo "Sin cambios en el historial."
            exit 0
          fi
          git commit -m "Añadido nuevo chollo publicado al historial"
          for intento in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" \
              && git push origin "HEAD:${GITHUB_REF_NAME:-main}" && exit 0
            echo "Intento $intento fallido; reintentando..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::No se pudo subir el historial."
          exit 1
