name: Bot Automatico CholloVolt

on:
  schedule:
    # Se ejecuta automáticamente cada 2 horas entre las 08:00 y las 22:00 UTC
    - cron: '0 8,10,12,14,16,18,20,22 * * *'
  workflow_dispatch: # Botón manual para probarlo cuando quieras desde GitHub

permissions:
  contents: write

jobs:
  publicar-chollo:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar librerías y navegador Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: 4. Ejecutar el Cazador de Chollos y Publicar en X
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          X_USER: ${{ secrets.X_USER }}
          X_PASS: ${{ secrets.X_PASS }}
        run: python auto_chollovolt.py

      - name: 5. Guardar el ASIN publicado en el historial
        run: |
          git config --global user.name "CholloVolt-Bot"
          git config --global user.email "bot@chollovolt.local"
          git add historial_publicados.txt
          git diff --staged --quiet || git commit -m "Añadido nuevo chollo publicado al historial"
          git push
