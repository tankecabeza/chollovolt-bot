name: Bot Automatico CholloVolt

on:
  schedule:
    # Se lanza cada 2 horas en el minuto 17 (ej. 08:17, 10:17, 12:17 UTC)
    - cron: '17 8-22/2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Evita que dos ejecuciones (manual y programada) se pisen
concurrency:
  group: publicar-chollo
  cancel-in-progress: false

jobs:
  publicar-chollo:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalar librerías y navegador Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 3b. Espera aleatoria anti-spam (0-25 min)
        run: |
          TIEMPO=$((RANDOM % 1500))
          echo "⏳ Aplicando jitter: Esperando $TIEMPO segundos antes de ejecutar el bot..."
          sleep $TIEMPO

      - name: 4. Ejecutar el bot y publicar en X
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          X_STATE: ${{ secrets.X_STATE }}
        run: python auto_chollovolt.py

      - name: 4b. Subir captura si ha fallado
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-captura
          path: error.png
          if-no-files-found: ignore

      - name: 5. Guardar el ASIN publicado en el historial
        run: |
          git config --global user.name "CholloVolt-Bot"
          git config --global user.email "bot@chollovolt.local"
          git add historial_publicados.txt
          git diff --staged --quiet || git commit -m "Añadido nuevo chollo publicado al historial"
          git push
